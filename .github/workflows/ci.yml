name: Chroma Web Platform CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-web:
    name: Web Platform Layout Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Web Layout
        run: |
          test -d Production
          test -d Testing
          echo "Chromalabs.cc layout verified."
